<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <title>Create</title>
</head>



<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container">
        <div class="row">
            <div class="col-12 col-md-8 col-lg-8 mx-auto mb-5">

                <h2 class="text-center pb-4 pt-4">Create a new Author</h2>

                <form th:action="@{/authors/create}" th:object="${author}" method="post">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input class="form-control" type="text" id="name" th:field="*{name}">
                        <ul th:if="${#fields.hasErrors('name')}" class="text-danger">
                            <li th:each="err : ${#fields.errors('name')}" th:text="${err}"></li>
                        </ul>

                        <label for="authorDescription">Biography</label>
                        <input class="form-control" type="text" id="name" th:field="*{biography}">
                        <ul th:if="${#fields.hasErrors('biography')}" class="text-danger">
                            <li th:each="err : ${#fields.errors('biography')}" th:text="${err}"></li>
                        </ul>


                        <div class="d-flex justify-content-between pt-3">
                            <input type="submit" class="btn card-btn" value="Create new author">
                            <input type="reset" class="btn btn-warning" value="Reset all fields">
                        </div>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
