<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/show.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <title>Not Found</title>
</head>



<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container col-lg-6" th:object="${author}">
        <div class="card text-center mt-4">
            <h1 class="card-text-color pt-4">
                <strong>There is no Author available</strong>
            </h1>
            <div class="px-5">
                <p class="pt-1 text-justify card-synopsis-font-size">You reached the end of our available authors or you
                    passed an id that it's not present in our database, please try again.</p>
            </div>

            <div class="d-flex justify-content-around pb-3">
                <a class="btn card-btn" th:href="@{/home}">Home</a>
                <a class="btn card-btn" th:href="@{/authors}">Authors</a>
            </div>

        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>
</body>

</html>
