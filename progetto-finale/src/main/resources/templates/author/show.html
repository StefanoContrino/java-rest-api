<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/show.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <title>Author Information</title>
</head>



<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container col-lg-6" th:object="${author}">
        <div class="card text-center mt-4">
            <h1 class="card-text-color pt-4">
                <strong>[[*{name}]]</strong>
            </h1>
            <img th:src="*{imgUrl}" class="card-img-top card-img-style py-3" alt="...">
            <div class="px-5">
                <p class="pt-1 text-justify card-synopsis-font-size">[[*{biography}]]</p>
            </div>
            <h2 class="card-text-color pt-3">
                <strong>Available Books</strong>
            </h2>
            <div class="my-3">
                <div th:each="book : *{books}" class="px-3 my-1">
                    <a th:href="@{/books/{id}(id=${book.id})}" class="btn w-100 text-center py-3 rounded-0"
                        style="background-color: lightgrey; border: lightgrey; color: black;">
                        [[${book.name}]]
                    </a>
                </div>
                <div class="d-flex justify-content-around pt-3">
                    <a class="btn card-btn" th:href="@{/authors/{id}(id=${author.id - 1})}">Previous Author</a>
                    <a class="btn card-btn" th:href="@{/authors/{id}(id=${author.id + 1})}">Next Author</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
