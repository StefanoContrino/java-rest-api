<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">

    <title>Edit</title>
</head>



<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-8 mx-auto">
                <h2 class="text-center pb-4 pt-4">Edit</h2>

                <form id="name" th:action="@{/books/edit/{id}(id=${book.id})}" method="post" th:object="${book}">

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input class="form-control" type="text" id="name" th:field="*{name}">

                        <label for="ISBN">ISBN</label>
                        <input class="form-control" type="text" id="ISBN" th:field="*{ISBN}">

                        <label for="author">Author</label>
                        <input class="form-control" type="text" id="author" th:field="*{author.name}">

                        <label for="publishingHouse">Publishing House</label>
                        <input class="form-control" type="text" id="publishingHouse" th:field="*{publishingHouse}">

                        <label for="synopsis">Synopsis</label>
                        <textarea class="form-control" type="text" id="synopsis" th:field="*{synopsis}"></textarea>

                        <label for="publicationDate">Publication Date</label>
                        <input class="form-control" type="date" id="publicationDate" th:field="*{publicationDate}">

                        <label for="genre">Genre</label>
                        <input class="form-control" type="text" id="genre" th:field="*{genre}">

                        <label for="language">Language</label>
                        <input class="form-control" type="text" id="language" th:field="*{language}">

                        <label for="price">Price</label>
                        <input class="form-control" type="number" id="price" th:field="*{price}">

                        <div class="d-flex justify-content-center pt-3 pb-5">
                            <input type="submit" class="btn card-btn" value="Update the book">
                        </div>
                    </div>

                </form>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
